<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register as Donor - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #e11d48;
            --primary-hover: #be123c;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        .bg-art {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('blood.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
        }
        .form-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            border: 1px solid #e2e8f0;
        }
        .badge {
            display: inline-block;
            background: #ffe4e6;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 10px;
        }
        p.sub {
            color: var(--text-gray);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-dark);
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(225,29,72,0.1);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(225,29,72,0.3);
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: var(--primary);
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .loading-box {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #fecdd3;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-art"></div>
    <div class="bg-grid"></div>

    <div class="form-card">
        <div class="badge">🩸 Donor Registration</div>
        <h1>BECOME A <span style="color:var(--primary)">DONOR</span></h1>
        <p class="sub">Fill in your details to join the life-saving network.</p>

        <form id="donorForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label for="bloodType">Blood Type</label>
                <select id="bloodType" required>
                    <option value="">Select blood type</option>
                    <option value="O-">O-</option>
                    <option value="O+">O+</option>
                    <option value="A-">A-</option>
                    <option value="A+">A+</option>
                    <option value="B-">B-</option>
                    <option value="B+">B+</option>
                    <option value="AB-">AB-</option>
                    <option value="AB+">AB+</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="Emergency contact number">
            </div>
            <div class="form-group">
                <label for="city">City / Location</label>
                <input type="text" id="city" required placeholder="Your city or area">
            </div>
            <div class="form-group">
                <label for="age">Age (optional)</label>
                <input type="number" id="age" min="18" max="65" placeholder="Age">
            </div>
            <button type="submit" class="btn">Register as Donor</button>
        </form>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loading-msg">Saving your details...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, setDoc, onAuthStateChanged } from "./firebase-config.js";
        import { showLoading, hideLoading, toast } from "./utils.js";

        // Redirect if not logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            // Prefill name if available
            if (user.displayName) {
                document.getElementById('name').value = user.displayName;
            }
        });

        document.getElementById('donorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const name = document.getElementById('name').value.trim();
            const bloodType = document.getElementById('bloodType').value;
            const phone = document.getElementById('phone').value.trim();
            const city = document.getElementById('city').value.trim();
            const age = document.getElementById('age').value || '';

            if (!name || !bloodType || !phone || !city) {
                toast('Please fill in all required fields.', 'error');
                return;
            }

            showLoading('Saving your details...');
            try {
                await setDoc(doc(db, 'donors', user.uid), {
                    uid: user.uid,
                    name,
                    bloodType,
                    phone,
                    city,
                    age: age || null,
                    email: user.email,
                    photoURL: user.photoURL || '',
                    createdAt: new Date().toISOString()
                });
                hideLoading();
                toast('Registration successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'donor-dashboard.html';
                }, 1000);
            } catch (err) {
                hideLoading();
                toast('Error saving details: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
