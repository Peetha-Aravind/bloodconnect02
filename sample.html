<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BloodConnect - Navigation</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
    <style>
        /* ===== GLOBAL VARIABLES ===== */
        :root {
            --page-bg: #f4f5f7;
            --header-bg: #ffffff;
            --text-color: rgb(24, 24, 26);
            --text-sub: #6b7280;
            --brand-primary: #e11d48; /* Red */
            --brand-primary-hover: #be123c; /* Dark Red */
            --border-subtle: #e5e7eb;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --sidebar-width: 280px;
            --topbar-height: 70px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sidebar: 4px 0 24px rgba(0, 0, 0, 0.04);
            --shadow-mobile-sidebar: 12px 0 40px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none !important;
        }
        
        body {
            font-family: "DM Sans", Roboto, sans-serif;
            background-color: var(--page-bg);
            overflow-x: hidden;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }
        
        body.sidebar-open { overflow: hidden; }

        /* ===== SIDEBAR DESIGN ===== */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            height: 100dvh;
            left: 0;
            z-index: 1000;
            border-right: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sidebar);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.3s ease;
            transform: translateX(0);
        }
        
        .sidebar-brand {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .sidebar-brand h2 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            text-transform: uppercase;
        }
        
        .sidebar-brand h2 span { color: var(--brand-primary); }
        
        .close-sidebar-btn {
            display: none; 
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f4f5f7;
            border: none;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        
        .close-sidebar-btn:active { transform: scale(0.9); }

        /* Top Profile Card */
        .sidebar-profile-card {
            margin: 0 24px 20px;
            padding: 16px;
            background-color: #f9fafb;
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .avatar-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #0d9488;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        
        .avatar-circle img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        .sidebar-profile-card .info { flex: 1; min-width: 0; }
        
        .sidebar-profile-card .info h4 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .sidebar-profile-card .info p {
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Navigation Menu */
        .sidebar-menu {
            list-style: none;
            padding: 0 16px 20px;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .sidebar-menu li { margin-bottom: 12px; }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 20px;
            color: #374151;
            border-radius: var(--radius-lg);
            transition: var(--transition-smooth);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .nav-link i {
            font-size: 18px;
            width: 22px;
            text-align: center;
            color: #6b7280;
            transition: var(--transition-smooth);
        }
        
        .nav-link:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        
        /* 1. DARK RED ACTIVE STATE */
        .nav-link.active {
            background-color: var(--brand-primary-hover); /* Dark Red Background */
            color: #ffffff; /* White Text */
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(190, 18, 60, 0.25);
        }
        
        .nav-link.active i { 
            color: #ffffff; /* White Icon */
        }

        /* Footer (Email & Logout) */
        .sidebar-footer {
            padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)) 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            background-color: #ffffff;
        }
        
        .footer-badge, .logout-btn {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer-badge {
            border: 1px solid var(--border-subtle);
            color: #4b5563;
            gap: 12px;
        }
        
        .footer-badge i { color: var(--brand-primary); font-size: 15px; }
        .footer-badge span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .logout-btn {
            background: transparent;
            border: 1px solid #fda4af;
            color: var(--brand-primary);
            cursor: pointer;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            transition: var(--transition-smooth);
        }
        
        .logout-btn:hover { background: #fff1f2; }

        /* ===== MOBILE OVERLAY ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.3s ease;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* ===== WRAPPER & TOPBAR ===== */
        .wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .topbar {
            background-color: var(--header-bg);
            height: var(--topbar-height);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        
        .topbar-left-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .topbar-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1d1e20;
            letter-spacing: -0.2px;
        }
        
        .topbar-title p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
        }
        
        .menu-toggle {
            display: none;
            background-color: #ffffff;
            color: #1d1e20;
            border: 1px solid var(--border-subtle);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .mobile-brand {
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
        }
        
        .mobile-brand i { color: var(--brand-primary); font-size: 22px; }
        .mobile-brand span { color: var(--brand-primary); }

        .mobile-topbar-avatar {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #0d9488;
            color: #ffffff;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-subtle);
            padding: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .mobile-topbar-avatar img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* ===== MAIN CONTENT AREA (Empty for now) ===== */
        .content-inner {
            padding: 28px;
            width: 100%;
        }

        /* ===== RESPONSIVE MOBILE ADJUSTMENTS ===== */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 300px;
                --topbar-height: 60px;
            }
            
            .sidebar {
                transform: translateX(-100%);
                border-radius: 0 24px 24px 0; 
                border-right: none;
                box-shadow: var(--shadow-mobile-sidebar);
            }
            .sidebar.active { transform: translateX(0); }
            
            .close-sidebar-btn { display: flex; }

            .wrapper { margin-left: 0; }
            
            .topbar {
                height: 60px;
                padding: 0 16px;
                justify-content: space-between; 
            }
            
            .topbar-left-section { position: static; transform: none; }
            
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .topbar-title.desktop-title { display: none; }
            
            .mobile-brand {
                display: flex;
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                pointer-events: none;
            }
            
            .mobile-topbar-avatar { display: flex; }
            .sidebar-overlay.active { display: block; }
        }

        @media (min-width: 769px) {
            .sidebar { transform: translateX(0) !important; }
            .sidebar-overlay { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <!-- Brand & Close Button -->
        <div class="sidebar-brand">
            <h2>BLOOD<span>CONNECT</span></h2>
            <button class="close-sidebar-btn" id="closeSidebarBtn" aria-label="Close Menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <!-- Top Profile Card -->
        <div class="sidebar-profile-card">
            <div class="avatar-circle">
                <span id="dd-avatar-text">A</span>
                <img id="dd-avatar" src="" alt="User Avatar">
            </div>
            <div class="info">
                <h4 id="dd-name">Aravind</h4>
                <p>DONOR</p>
            </div>
        </div>

        <!-- Navigation Links -->
        <ul class="sidebar-menu">
            <li>
                <a href="#dashboard" class="nav-link active" data-section="dashboard">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="#emergency" class="nav-link" data-section="emergency">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Emergency Alerts</span>
                </a>
            </li>
            <li>
                <a href="#history" class="nav-link" data-section="history">
                    <i class="fa-regular fa-heart"></i>
                    <span>My Donation</span>
                </a>
            </li>
            <li>
                <a href="#profile" class="nav-link" data-section="profile">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Profile & Location</span>
                </a>
            </li>
        </ul>

        <!-- Bottom Footer (Email & Sign Out) -->
        <div class="sidebar-footer">
            <div class="footer-badge">
                <i class="fa-regular fa-envelope"></i>
                <span id="dd-email">aravind@example.com</span>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- ===== MAIN WRAPPER & TOPBAR ===== -->
    <div class="wrapper">
        <header class="topbar">
            <!-- Left Side: Hamburger & Desktop Title -->
            <div class="topbar-left-section">
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="topbar-title desktop-title">
                    <h2>Dashboard</h2>
                    <p>Overview of your blood donation journey.</p>
                </div>
            </div>
            
            <!-- Center: Mobile Brand -->
            <div class="mobile-brand">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>Blood<span style="color:var(--brand-primary);">Connect</span></span>
            </div>
            
            <!-- Right Side: Mobile Profile Avatar -->
            <div class="topbar-right-section">
                <button class="mobile-topbar-avatar" id="mobileTopbarAvatarBtn" aria-label="Open Sidebar Menu">
                    <span id="mobile-topbar-avatar-text">A</span>
                    <img id="mobile-topbar-avatar-img" src="" alt="User">
                </button>
            </div>
        </header>

        <!-- 2. MAIN CONTENT AREA (Emptied as requested) -->
        <main class="content-inner" id="mainContent">
            <!-- Page content boxes will be injected/displayed here -->
        </main>
    </div>

    <!-- ===== JAVASCRIPT FOR UI TOGGLING & NAVIGATION ===== -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const topbarAvatarBtn = document.getElementById('mobileTopbarAvatarBtn');
        const navLinks = document.querySelectorAll('.nav-link[data-section]');
        
        const topbarTitle = document.querySelector('.topbar-title.desktop-title h2');
        const topbarDesc = document.querySelector('.topbar-title.desktop-title p');

        // Titles configuration
        const sectionMeta = {
            'dashboard': { title: 'Dashboard', desc: 'Overview of your blood donation journey.' },
            'emergency': { title: 'Emergency Alerts', desc: 'Urgent blood requests in your area.' },
            'history': { title: 'My Donation', desc: 'Your donation history and certificates.' },
            'profile': { title: 'Profile & Location', desc: 'Manage your account settings.' }
        };

        // Navigation UI logic
        function navigateTo(sectionId) {
            if (!sectionMeta[sectionId]) return;

            // Manage Active State Classes
            navLinks.forEach(link => {
                if (link.dataset.section === sectionId) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // Update Topbar
            if (topbarTitle) topbarTitle.textContent = sectionMeta[sectionId].title;
            if (topbarDesc) topbarDesc.textContent = sectionMeta[sectionId].desc;
        }

        // Attach click events to nav links
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const section = link.dataset.section;
                
                navigateTo(section);
                
                // Auto-close sidebar on mobile
                if (window.innerWidth < 768 && isSidebarOpen()) {
                    closeSidebar();
                }
            });
        });

        // Sidebar Toggle Logic
        function openSidebar() {
            sidebar.classList.add('active');
            sidebarOverlay.classList.add('active');
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
            document.body.classList.remove('sidebar-open');
        }

        function isSidebarOpen() {
            return sidebar.classList.contains('active');
        }

        menuToggle.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            isSidebarOpen() ? closeSidebar() : openSidebar();
        });
        
        topbarAvatarBtn.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            openSidebar();
        });
        
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        
        // Resize listener to prevent glitches
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768 && isSidebarOpen()) {
                closeSidebar();
            }
        });
    </script>
</body>
</html>
