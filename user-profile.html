<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodConnect - Profile Settings (Vastramaya UI)</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
    <style>
        /* ===== VASTRAMAYA GLOBAL VARIABLES (Main Content) ===== */
        :root {
            --page-bg: #f4f5f7;
            --header-bg: #ffffff;
            --text-color: rgb(24, 24, 26);
            --text-sub: #6b7280;
            --icon-color: #6b7280;
            --icon-active: #5127ba;
            --active-bg: #f3f4f6;
            --hover-bg: #f3f4f6;
            --border-subtle: #e5e7eb;
            --brand-primary: #5127ba;
            --brand-gradient: linear-gradient(135deg, #5127ba 0%, #673de6 100%);
            --danger-color: #ef4444;
            --success-color: #10B981;
            --warning-color: #f59e0b;
            --switch-on: #5127ba;
            --switch-off: #9CA3AF;
            --shadow-premium: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        /* ===== ORIGINAL BLOODCONNECT SIDEBAR COLORS (Preserved) ===== */
        :root {
            --sidebar-primary: #e11d48;
            --sidebar-primary-hover: #be123c;
            --sidebar-bg: #ffffff;
            --sidebar-hover-bg: #f1f5f9;
            --sidebar-text-main: #64748b;
            --sidebar-text-dark: #0f172a;
            --sidebar-border: #e2e8f0;
            --sidebar-active-bg: #e11d48;
            --sidebar-icon-color: #94a3b8;
            --sidebar-active-icon: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none !important;
        }

        body {
            font-family: "DM Sans", Roboto, sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-color);
            background-color: var(--page-bg);
            overflow-x: hidden;
            width: 100%;
        }

        /* ===== SIDEBAR (Original BloodConnect style) ===== */
        .sidebar {
            width: 270px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text-main);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
            border-right: 1px solid var(--sidebar-border);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.02);
        }
        .sidebar-brand {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--sidebar-text-dark);
            border-bottom: 1px solid var(--sidebar-border);
            height: 70px;
        }
        .sidebar-brand i {
            font-size: 26px;
            color: var(--sidebar-primary);
        }
        .sidebar-brand h2 {
            font-size: 20px;
            font-weight: 600;
        }
        .sidebar-brand span {
            color: var(--sidebar-primary);
        }
        .sidebar-menu {
            list-style: none;
            padding: 15px 12px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .menu-category {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #94a3b8;
            padding: 12px 10px 6px 10px;
        }
        .sidebar-menu li {
            margin-bottom: 4px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: var(--sidebar-text-main);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.25s ease-in-out;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
        }
        .nav-link i {
            font-size: 16px;
            width: 20px;
            text-align: center;
            color: var(--sidebar-icon-color);
            transition: all 0.25s ease-in-out;
        }
        .nav-link:hover {
            background-color: var(--sidebar-hover-bg);
            color: var(--sidebar-text-dark);
            transform: translateX(3px);
        }
        .nav-link:hover i {
            color: var(--sidebar-primary);
        }
        .nav-link.active {
            background-color: var(--sidebar-active-bg);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
        }
        .nav-link.active i {
            color: #ffffff;
        }
        .badge {
            margin-left: auto;
            background-color: #f1f5f9;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 12px;
            color: var(--sidebar-text-main);
        }
        .nav-link.active .badge {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .badge.alert {
            background-color: #ffe4e6;
            color: var(--sidebar-primary);
        }
        .nav-link.active .badge.alert {
            background-color: #ffffff;
            color: var(--sidebar-primary);
        }
        .user-profile {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #f8fafc;
            border-top: 1px solid var(--sidebar-border);
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease-in-out;
        }
        .user-profile:hover {
            background-color: var(--sidebar-hover-bg);
        }
        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ca8a04;
        }
        .user-info h4 {
            font-size: 13px;
            font-weight: 500;
            color: var(--sidebar-text-dark);
        }
        .user-info p {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ca8a04;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #059669;
            box-shadow: 0 0 6px #059669;
        }
        .status-dot.yellow {
            background-color: #ca8a04;
            box-shadow: 0 0 6px #ca8a04;
        }
        .status-dot.inactive {
            background-color: #94a3b8;
            box-shadow: none;
        }
        .profile-popup {
            display: none;
            position: absolute;
            bottom: calc(100% + 5px);
            left: 12px;
            right: 12px;
            background: #ffffff;
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 8px;
            z-index: 1001;
            animation: popupFadeIn 0.2s ease-out;
        }
        .profile-popup.active {
            display: block;
        }
        .popup-email {
            font-size: 13px;
            color: var(--sidebar-text-dark);
            padding: 8px 10px 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 6px;
            font-weight: 500;
            word-break: break-all;
        }
        .nav-link-logout {
            color: var(--sidebar-primary);
        }
        .nav-link-logout i {
            color: var(--sidebar-primary);
        }
        .nav-link-logout:hover,
        .nav-link-logout.active {
            background-color: #ffe4e6;
            color: var(--sidebar-primary-hover);
            box-shadow: none;
        }
        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== TOPBAR ===== */
        .wrapper {
            margin-left: 270px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all 0.25s ease-in-out;
        }
        .topbar {
            background-color: var(--header-bg);
            height: 70px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .topbar-title h2 {
            font-size: 20px;
            font-weight: 700;
            line-height: 32px;
            color: rgb(29, 30, 32);
        }
        .topbar-title p {
            font-size: 13px;
            color: var(--text-sub);
        }
        .menu-toggle {
            display: none;
            background-color: var(--header-bg);
            color: var(--text-color);
            border: 1px solid var(--border-subtle);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        /* ===== MAIN CONTENT (VASTRAMAYA) ===== */
        .content-inner {
            max-width: 1110px;
            margin: 0 auto;
            padding: 24px 24px 40px;
            width: 100%;
        }
        .mobile-content-inner {
            padding: 16px;
            width: 100%;
            overflow-x: hidden;
        }

        /* Cards */
        .card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            width: 100%;
        }
        .card-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        /* Buttons */
        .primary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            color: #ffffff;
            background: var(--brand-primary);
            transition: background 0.15s ease;
            cursor: pointer;
        }
        .primary-btn:hover {
            background: #471ea7;
        }
        .primary-btn i {
            font-size: 14px;
        }
        .btn-secondary {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: #ffffff;
            font-size: 13px;
            color: #673de6;
            transition: background 0.15s ease;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: #f2efff;
        }
        .btn-success {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            color: #ffffff;
            background: var(--success-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-success:hover {
            background: #059669;
        }

        /* Forms */
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background: white;
            transition: all 0.15s ease;
            font-size: 0.95rem;
            color: var(--text-color);
        }
        .form-input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(81, 39, 186, 0.1);
            outline: none;
        }

        /* Utility */
        .text-sub {
            color: var(--text-sub);
        }
        .tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        .tag.red {
            background: #ffe4e6;
            color: #e11d48;
        }
        .tag.green {
            background: #d1fae5;
            color: #059669;
        }
        .tag.purple {
            background: #f3e8ff;
            color: #7e22ce;
        }
        .tag.yellow {
            background: #fef9c3;
            color: #ca8a04;
        }
        .tag.gray {
            background: #f1f5f9;
            color: #64748b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                left: -270px;
            }
            .sidebar.active {
                left: 0;
            }
            .wrapper {
                margin-left: 0;
            }
            .menu-toggle {
                display: block;
            }
            .topbar {
                padding: 0 20px;
            }
            .content-inner {
                padding: 16px;
            }
            .mobile-content-inner {
                display: block;
            }
            .desktop-only {
                display: none !important;
            }
            .mobile-only {
                display: block !important;
            }
        }

        @media (min-width: 769px) {
            .mobile-only {
                display: none !important;
            }
            .desktop-only {
                display: block !important;
            }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar Menu (Original BloodConnect style retained) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-heart-pulse"></i>
            <h2>Blood<span>Connect</span></h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-category">Overview</li>
            <li>
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-house-medical"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="menu-category">Activity</li>
            <li>
                <a href="emergency.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    <span>Emergency Alerts</span>
                    <span class="badge alert" id="emergency-badge">0</span>
                </a>
            </li>
            <li>
                <a href="history.html" class="nav-link">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>My Donations</span>
                </a>
            </li>
            <li class="menu-category">Settings</li>
            <li>
                <a href="profile-settings.html" class="nav-link active">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>Profile & Location</span>
                </a>
            </li>
        </ul>
        <div class="user-profile" id="userProfileBtn">
            <img id="dd-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&auto=format&fit=crop&q=80" alt="User Avatar">
            <div class="user-info">
                <h4 id="dd-name">Loading...</h4>
                <p id="dd-status-text"><span class="status-dot yellow"></span> Recovery Period</p>
            </div>
            <div class="profile-popup" id="profilePopup">
                <div class="popup-email" id="dd-email">Loading email...</div>
                <a href="#" class="nav-link nav-link-logout" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </aside>

    <div class="wrapper">
        <header class="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="topbar-title">
                    <h2>Profile Settings</h2>
                    <p>Update your personal details and location preferences.</p>
                </div>
            </div>
            <div class="topbar-right"></div>
        </header>

        <main class="content-inner" id="mainContent">
            <!-- Profile form injected by JS -->
        </main>
    </div>

    <!-- Loading overlay -->
    <div id="loading" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.7); z-index:3000; align-items:center; justify-content:center;">
        <div style="background:white; padding:20px 30px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1); text-align:center;">
            <div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#5127ba;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
            <p id="loading-msg" style="margin-top:10px; font-size:14px;">Please wait...</p>
        </div>
    </div>
    <div id="toast" style="position:fixed; bottom:20px; right:20px; z-index:4000;"></div>

    <script type="module">
        import { auth, onAuthStateChanged, db, doc, getDoc, updateDoc, fbSignOut } from "./firebase-config.js";
        import { showLoading, hideLoading, toast } from "./utils.js";

        let donor = null;
        let isEditing = false;
        const mainContent = document.getElementById('mainContent');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const userProfileBtn = document.getElementById('userProfileBtn');
        const profilePopup = document.getElementById('profilePopup');

        // Helpers
        function formatDate(value) {
            if (!value) return 'No record';
            const date = value?.toDate ? value.toDate() : new Date(value);
            if (isNaN(date.getTime())) return 'No record';
            return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getEligibilityInfo() {
            if (!donor?.lastDonationDate && !donor?.lastDonation) {
                return { isRecovery: false, text: 'No donation yet', tag: 'gray' };
            }
            const lastDate = donor.lastDonationDate?.toDate ? donor.lastDonationDate.toDate() : new Date(donor.lastDonationDate || donor.lastDonation);
            if (isNaN(lastDate.getTime())) return { isRecovery: false, text: 'Unknown', tag: 'gray' };
            const eligibleDate = new Date(lastDate);
            eligibleDate.setDate(eligibleDate.getDate() + 90);
            const now = new Date();
            if (eligibleDate > now) {
                return { isRecovery: true, text: `Eligible after ${formatDate(eligibleDate)}`, tag: 'yellow' };
            }
            return { isRecovery: false, text: 'Eligible now', tag: 'green' };
        }

        function getField(field, fallback = '') {
            return donor?.[field] ?? fallback;
        }

        // Render profile form
        function renderProfileForm() {
            if (!donor) return;
            const disabled = isEditing ? '' : 'disabled';
            const hint = isEditing ? '' : '<span class="text-sub" style="font-size:12px;">Click "Edit Profile" to make changes</span>';
            const avatar = auth.currentUser?.photoURL || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80';

            mainContent.innerHTML = `
                <div class="card" style="max-width:700px; margin:0 auto;">
                    <div class="card-header" style="display:flex; align-items:center; gap:20px;">
                        <img src="${avatar}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #f1f5f9;">
                        <div>
                            <h3 style="font-size:20px; font-weight:700;">${getField('name', 'Donor')}</h3>
                            <p class="text-sub" style="font-size:13px;">Registered Donor &bull; Member since 2024</p>
                            <p class="text-sub" style="font-size:12px; margin-top:4px;"><i class="fa-solid fa-envelope"></i> ${auth.currentUser?.email || 'No email'}</p>
                        </div>
                    </div>
                    <div style="padding:24px;">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">FULL NAME</label>
                                <input class="form-input" id="pf-name" value="${getField('name')}" ${disabled}>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">PHONE NUMBER</label>
                                <input class="form-input" id="pf-phone" value="${getField('phone')}" ${disabled}>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">BLOOD GROUP</label>
                                <select class="form-input" id="pf-blood-group" ${disabled}>
                                    <option value="">Select Blood Group</option>
                                    ${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(bg => `<option value="${bg}" ${donor?.bloodGroup === bg ? 'selected' : ''}>${bg}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">AGE</label>
                                <input class="form-input" type="number" id="pf-age" value="${getField('age')}" ${disabled} min="18" max="65">
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">GENDER</label>
                                <select class="form-input" id="pf-gender" ${disabled}>
                                    <option value="">Select Gender</option>
                                    <option value="Male" ${donor?.gender === 'Male' ? 'selected' : ''}>Male</option>
                                    <option value="Female" ${donor?.gender === 'Female' ? 'selected' : ''}>Female</option>
                                    <option value="Other" ${donor?.gender === 'Other' ? 'selected' : ''}>Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">WEIGHT (KG)</label>
                                <input class="form-input" type="number" id="pf-weight" value="${getField('weight')}" ${disabled} min="45" max="200">
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">PRIMARY LOCATION</label>
                                <input class="form-input" id="pf-location" value="${getField('location')}" ${disabled}>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">CITY</label>
                                <input class="form-input" id="pf-city" value="${getField('city')}" ${disabled}>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">STATE</label>
                                <input class="form-input" id="pf-state" value="${getField('state')}" ${disabled}>
                            </div>
                            <div>
                                <label class="text-sub" style="font-size:12px; font-weight:600;">PINCODE</label>
                                <input class="form-input" id="pf-pincode" value="${getField('pincode')}" ${disabled} maxlength="10">
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="text-sub" style="font-size:12px; font-weight:600;">FULL ADDRESS</label>
                                <input class="form-input" id="pf-address" value="${getField('address')}" ${disabled}>
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="text-sub" style="font-size:12px; font-weight:600;">MEDICAL CONDITIONS</label>
                                <input class="form-input" id="pf-medical" value="${getField('medicalConditions')}" ${disabled} placeholder="Any health conditions we should know about">
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="text-sub" style="font-size:12px; font-weight:600;">LAST DONATION DATE</label>
                                <input class="form-input" type="text" value="${formatDate(donor?.lastDonationDate || donor?.lastDonation)}" disabled style="background-color:#f8fafc; color:#94a3b8;">
                            </div>
                        </div>
                        ${hint}
                        <div style="display:flex; gap:12px; margin-top:20px;">
                            ${!isEditing ? `
                                <button class="primary-btn" id="btn-edit-profile"><i class="fa-solid fa-pen-to-square"></i> Edit Profile</button>
                            ` : `
                                <button class="btn-success" id="btn-save-profile"><i class="fa-solid fa-check"></i> Save Changes</button>
                                <button class="btn-secondary" id="btn-cancel-edit"><i class="fa-solid fa-xmark"></i> Cancel</button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('btn-edit-profile')?.addEventListener('click', () => {
                isEditing = true;
                renderProfileForm();
            });
            document.getElementById('btn-save-profile')?.addEventListener('click', saveProfile);
            document.getElementById('btn-cancel-edit')?.addEventListener('click', () => {
                isEditing = false;
                renderProfileForm();
            });
        }

        async function saveProfile() {
            if (!donor?.uid) {
                toast('Donor data not loaded.', 'error');
                return;
            }
            const name = document.getElementById('pf-name').value.trim();
            const phone = document.getElementById('pf-phone').value.trim();
            const bloodGroup = document.getElementById('pf-blood-group').value;
            const age = document.getElementById('pf-age').value;
            const gender = document.getElementById('pf-gender').value;
            const weight = document.getElementById('pf-weight').value;
            const location = document.getElementById('pf-location').value.trim();
            const city = document.getElementById('pf-city').value.trim();
            const state = document.getElementById('pf-state').value.trim();
            const pincode = document.getElementById('pf-pincode').value.trim();
            const address = document.getElementById('pf-address').value.trim();
            const medicalConditions = document.getElementById('pf-medical').value.trim();

            if (!name) { toast('Please enter your full name.', 'error'); return; }
            if (!phone) { toast('Please enter your phone number.', 'error'); return; }
            if (!bloodGroup) { toast('Please select your blood group.', 'error'); return; }

            const updates = {
                name,
                phone,
                bloodGroup,
                age: age ? parseInt(age) : '',
                gender,
                weight: weight ? parseInt(weight) : '',
                location,
                city,
                state,
                pincode,
                address,
                medicalConditions,
                updatedAt: new Date().toISOString()
            };
            Object.keys(updates).forEach(key => {
                if (updates[key] === '' || updates[key] === undefined) delete updates[key];
            });

            showLoading('Saving your profile...');
            try {
                await updateDoc(doc(db, 'donors', donor.uid), updates);
                donor = { ...donor, ...updates };
                isEditing = false;
                hideLoading();
                toast('Profile updated successfully!', 'success');
                updateSidebarProfile();
                renderProfileForm();
            } catch (err) {
                hideLoading();
                toast('Failed to save: ' + err.message, 'error');
                console.error(err);
            }
        }

        function updateSidebarProfile() {
            if (!donor) return;
            document.getElementById('dd-name').textContent = donor.name || 'Donor';
            const eligibility = getEligibilityInfo();
            document.getElementById('dd-status-text').innerHTML =
                `<span class="status-dot ${eligibility.isRecovery ? 'yellow' : 'green'}"></span> ${eligibility.isRecovery ? 'Recovery Period' : 'Active Donor'}`;
            document.getElementById('dd-avatar').src = auth.currentUser?.photoURL ||
                'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&auto=format&fit=crop&q=80';
            document.getElementById('dd-email').textContent = auth.currentUser?.email || 'No email';
        }

        // Auth & data loading
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login-donor.html';
                return;
            }
            const snap = await getDoc(doc(db, 'donors', user.uid));
            if (!snap.exists()) {
                window.location.href = 'onboarding.html';
                return;
            }
            donor = { ...snap.data(), uid: user.uid };
            updateSidebarProfile();
            renderProfileForm();
        });

        // Sidebar mobile toggle
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Profile popup
        userProfileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profilePopup.classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            if (!profilePopup.contains(e.target) && !userProfileBtn.contains(e.target)) {
                profilePopup.classList.remove('active');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            showLoading('Signing out...');
            try {
                await fbSignOut(auth);
                hideLoading();
                window.location.href = 'index.html';
            } catch (err) {
                hideLoading();
                toast(err.message, 'error');
            }
        });

        // Fallback functions
        if (typeof showLoading !== 'function') {
            window.showLoading = (msg) => {
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('loading-msg').textContent = msg || 'Please wait...';
            };
        }
        if (typeof hideLoading !== 'function') {
            window.hideLoading = () => {
                document.getElementById('loading').style.display = 'none';
            };
        }
        if (typeof toast !== 'function') {
            window.toast = (msg, type) => {
                const toastEl = document.getElementById('toast');
                toastEl.textContent = msg;
                toastEl.style.background = type === 'success' ? '#059669' : type === 'error' ? '#e11d48' : '#334155';
                toastEl.style.color = '#fff';
                toastEl.style.padding = '12px 20px';
                toastEl.style.borderRadius = '6px';
                toastEl.style.opacity = '1';
                toastEl.style.transition = 'opacity 0.3s';
                toastEl.style.fontSize = '14px';
                toastEl.style.fontWeight = '500';
                toastEl.style.boxShadow = '0 4px 10px rgba(0,0,0,0.15)';
                toastEl.style.zIndex = '4000';
                toastEl.style.position = 'fixed';
                toastEl.style.bottom = '20px';
                toastEl.style.right = '20px';
                setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
            };
        }
    </script>
</body>
</html>
