<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Find Blood - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #e11d48;
            --primary-hover: #be123c;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }
        .bg-art {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('blood.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
        }
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .badge {
            display: inline-block;
            background: rgba(99,102,241,0.1);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        p.sub {
            color: var(--text-gray);
            margin-bottom: 30px;
        }
        .search-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            background-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(225,29,72,0.3);
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .donor-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #f1f5f9;
            transition: all 0.2s;
        }
        .donor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .donor-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffe4e6;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin: 0 auto 12px;
        }
        .donor-name {
            font-weight: 700;
            margin-bottom: 5px;
        }
        .blood-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .contact {
            font-size: 13px;
            color: var(--text-gray);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .loading-box {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #fecdd3;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="bg-art"></div>
    <div class="bg-grid"></div>

    <div class="search-container">
        <div class="badge">🔍 Find Blood</div>
        <h1>FIND <span style="color:var(--primary)">DONORS</span></h1>
        <p class="sub">Search for available blood donors in your area.</p>

        <div class="search-form">
            <div class="form-group">
                <label for="searchBloodType">Blood Type</label>
                <select id="searchBloodType">
                    <option value="">Any</option>
                    <option value="O-">O-</option>
                    <option value="O+">O+</option>
                    <option value="A-">A-</option>
                    <option value="A+">A+</option>
                    <option value="B-">B-</option>
                    <option value="B+">B+</option>
                    <option value="AB-">AB-</option>
                    <option value="AB+">AB+</option>
                </select>
            </div>
            <div class="form-group">
                <label for="searchLocation">Location</label>
                <input type="text" id="searchLocation" placeholder="City or area">
            </div>
            <button class="btn" id="searchBtn">Search</button>
        </div>

        <div id="results" class="results-grid"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loading-msg">Searching donors...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db, collection, query, where, getDocs, onAuthStateChanged } from "./firebase-config.js";
        import { showLoading, hideLoading, toast } from "./utils.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            }
        });

        function getBloodTypeStyle(bloodType) {
            const styles = {
                'O-': { bg: '#dc2626', color: '#fff' },
                'O+': { bg: '#ef4444', color: '#fff' },
                'A-': { bg: '#2563eb', color: '#fff' },
                'A+': { bg: '#3b82f6', color: '#fff' },
                'B-': { bg: '#16a34a', color: '#fff' },
                'B+': { bg: '#22c55e', color: '#fff' },
                'AB-': { bg: '#7c3aed', color: '#fff' },
                'AB+': { bg: '#9333ea', color: '#fff' },
            };
            return styles[bloodType] || { bg: '#6b7280', color: '#fff' };
        }

        function renderDonorCard(donor) {
            const bloodStyle = getBloodTypeStyle(donor.bloodType);
            const initials = donor.name?.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() || '?';
            const card = document.createElement('div');
            card.className = 'donor-card';
            card.innerHTML = `
                <div class="donor-avatar" style="background:${bloodStyle.bg}; color:${bloodStyle.color};">${initials}</div>
                <div class="donor-name">${donor.name || 'Anonymous'}</div>
                <span class="blood-type" style="background:${bloodStyle.bg}; color:${bloodStyle.color};">${donor.bloodType}</span>
                <div class="contact">
                    📍 ${donor.city || 'Unknown'}<br>
                    📞 ${donor.phone || 'Not provided'}
                </div>
            `;
            return card;
        }

        document.getElementById('searchBtn').addEventListener('click', async () => {
            const bloodType = document.getElementById('searchBloodType').value;
            const location = document.getElementById('searchLocation').value.trim().toLowerCase();

            showLoading('Searching donors...');
            try {
                let q = collection(db, 'donors');
                let constraints = [];
                if (bloodType) {
                    constraints.push(where('bloodType', '==', bloodType));
                }
                if (location) {
                    // Firestore doesn't support case-insensitive contains, so we filter after fetching
                    // For simplicity, fetch all and filter in JS
                    const donorsQuery = query(q, ...constraints);
                    const snapshot = await getDocs(donorsQuery);
                    let donors = [];
                    snapshot.forEach(doc => donors.push(doc.data()));
                    donors = donors.filter(d => (d.city || '').toLowerCase().includes(location));
                } else {
                    const donorsQuery = query(q, ...constraints);
                    const snapshot = await getDocs(donorsQuery);
                    snapshot.forEach(doc => donors.push(doc.data()));
                }

                const resultsDiv = document.getElementById('results');
                if (donors.length === 0) {
                    resultsDiv.innerHTML = `<div class="empty-state">No donors found. Try different filters.</div>`;
                } else {
                    resultsDiv.innerHTML = '';
                    donors.forEach(d => resultsDiv.appendChild(renderDonorCard(d)));
                }
            } catch (err) {
                toast('Search failed: ' + err.message, 'error');
            } finally {
                hideLoading();
            }
        });

        // Load all donors initially
        (async () => {
            try {
                const snapshot = await getDocs(collection(db, 'donors'));
                const donors = [];
                snapshot.forEach(doc => donors.push(doc.data()));
                const resultsDiv = document.getElementById('results');
                if (donors.length === 0) {
                    resultsDiv.innerHTML = `<div class="empty-state">No donors registered yet.</div>`;
                } else {
                    resultsDiv.innerHTML = '';
                    donors.forEach(d => resultsDiv.appendChild(renderDonorCard(d)));
                }
            } catch (err) {
                console.error(err);
            }
        })();
    </script>
</body>
</html>
