<script>
    // This script assumes Firebase Auth is already initialized and `auth`, `db`, `googleProvider` are available.
    // It also expects functions like `showAuthOverlay`, `removeAuthOverlay`, `triggerGoogleAuth` to be defined externally,
    // or you can integrate them here. Below is a self-contained version for the navbar toggling and rendering.
    
    // (Include the following inside a DOMContentLoaded or module script after Firebase is set up)
    
    const navbar = document.getElementById('navbar');
    const navProfile = document.getElementById('navProfile');
    const profileDropdown = document.getElementById('profileDropdown');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobileSlidebar = document.getElementById('mobileSlidebar');
    const mobileCloseBtn = document.getElementById('mobileCloseBtn');
    const mobileSlidebarBody = document.getElementById('mobileSlidebarBody');
    const mobileSlidebarFooter = document.getElementById('mobileSlidebarFooter');

    let dropdownOpen = false;
    let currentUser = null;
    let currentUserData = null;

    // Scroll effect
    window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 20);
    });

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
        if (dropdownOpen && !navbar.contains(e.target)) closeDropdown();
    });

    function closeDropdown() {
        dropdownOpen = false;
        profileDropdown.classList.remove('active');
        const chevron = document.querySelector('.profile-chevron');
        if (chevron) chevron.classList.remove('open');
    }

    function toggleDropdown() {
        dropdownOpen = !dropdownOpen;
        profileDropdown.classList.toggle('active', dropdownOpen);
        const chevron = document.querySelector('.profile-chevron');
        if (chevron) chevron.classList.toggle('open', dropdownOpen);
    }

    // Mobile slidebar
    function openMobileSlidebar() {
        mobileOverlay.classList.add('active');
        mobileSlidebar.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeMobileSlidebar() {
        mobileOverlay.classList.remove('active');
        mobileSlidebar.classList.remove('active');
        document.body.style.overflow = '';
    }
    hamburgerBtn.addEventListener('click', openMobileSlidebar);
    mobileCloseBtn.addEventListener('click', closeMobileSlidebar);
    mobileOverlay.addEventListener('click', closeMobileSlidebar);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeDropdown();
            closeMobileSlidebar();
        }
    });

    // Helper functions (avatar color, initials, blood type style) — include if not already defined
    function getAvatarColor(name) { /* ... */ return '#e11d48'; }
    function getInitials(name) { /* ... */ return 'U'; }
    function getBloodTypeStyle(type) { /* ... */ return {bg:'#6b7280', color:'#fff'}; }

    // Render function called on auth state change
    function renderNavProfile(user, userData) {
        currentUser = user;
        currentUserData = userData;

        if (!user) {
            // Signed out
            navProfile.innerHTML = `
                <button class="signin-btn" id="navSignInBtn" title="Sign in">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
                    Sign In
                </button>`;
            profileDropdown.innerHTML = `
                <div class="dropdown-signed-out">
                    <div class="signed-out-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></div>
                    <h4>Welcome</h4>
                    <p>Sign in to continue.</p>
                    <button class="google-signin-btn" id="googleSignInBtn">
                        <svg viewBox="0 0 24 24">...</svg> Sign in with Google
                    </button>
                </div>`;
            mobileSlidebarBody.innerHTML = `
                <div class="slidebar-signin-prompt">
                    <div class="prompt-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></div>
                    <h4>Welcome</h4>
                    <p>Sign in to view menu.</p>
                    <button class="slidebar-google-btn" id="mobileGoogleSignInBtn">Sign in with Google</button>
                </div>`;
            mobileSlidebarFooter.innerHTML = '';

            // Add event listeners
            document.getElementById('navSignInBtn').addEventListener('click', () => { /* triggerGoogleAuth() */ });
            document.getElementById('googleSignInBtn').addEventListener('click', () => { /* triggerGoogleAuth() */ });
            const mobileBtn = document.getElementById('mobileGoogleSignInBtn');
            if (mobileBtn) mobileBtn.addEventListener('click', () => { /* triggerGoogleAuth() */ });

        } else {
            const isDonor = userData?.role === 'donor';
            const isFinder = userData?.role === 'finder';
            const dashboardLink = isDonor ? 'donor-dashboard.html' : isFinder ? 'finder-dashboard.html' : 'dashboard.html';
            const roleLabel = isDonor ? 'Donor' : isFinder ? 'Finder' : 'Member';
            const displayName = userData?.name || user.displayName || 'User';
            const email = user.email || 'No email';
            const photoURL = user.photoURL || '';
            const avatarBg = getAvatarColor(displayName);
            const initials = getInitials(displayName);

            // Desktop
            navProfile.innerHTML = `
                <button class="profile-btn" id="profileBtn">
                    ${photoURL ? `<img class="profile-avatar" src="${photoURL}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="profile-avatar" style="background:${avatarBg}; display:none;">${initials}</div>` : `<div class="profile-avatar" style="background:${avatarBg};">${initials}</div>`}
                    <span class="profile-name">${displayName}</span>
                    <span class="profile-chevron"><svg width="14" height="14" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
                </button>`;

            profileDropdown.innerHTML = `
                <div class="dropdown-header">
                    ${photoURL ? `<img class="dropdown-avatar" src="${photoURL}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="dropdown-avatar" style="background:${avatarBg}; display:none;">${initials}</div>` : `<div class="dropdown-avatar" style="background:${avatarBg};">${initials}</div>`}
                    <div class="dropdown-info">
                        <div class="dropdown-name">${displayName}</div>
                        <div class="dropdown-email">${email}</div>
                        <span class="dropdown-role">${roleLabel}</span>
                    </div>
                </div>
                <div class="dropdown-body">
                    <a href="${dashboardLink}" class="dropdown-item">Dashboard</a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item signout-item" id="dropdownSignOut">Sign Out</button>
                </div>`;

            // Mobile slidebar
            mobileSlidebarBody.innerHTML = `
                <div class="slidebar-user-info">

            document.getElementById('dropdownSignOut').addEventListener('click', () => { /* signOut logic */ });
            document.getElementById('mobileLogoutBtn').addEventListener('click', () => { /* signOut logic */ closeMobileSlidebar(); });
